# Render Blueprint — BolKarigar
# Dashboard: Environment → add SMTP keys (Forgot Password OTP ke liye ZAROORI)
services:
  - type: web
    name: bolkarigar
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_FROM
        value: "BolKarigar <vkverma3185@gmail.com>"
      - key: SMTP_FROM_NAME
        value: BolKarigar
      # Secret — Render Dashboard me manually set karein:
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # RECOMMENDED on Render FREE (Gmail SMTP ports blocked):
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: vkverma3185@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
